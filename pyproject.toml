[project]
name = "ai-agentic-application"
version = "0.1.0"
description = "Teme pentru cursul AI Agentic Application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.19.0",
    "pydantic[email]>=2,<3",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
semantic-search = [
    "chromadb>=1.5.9",
    "pymupdf4llm>=1.28.2",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
